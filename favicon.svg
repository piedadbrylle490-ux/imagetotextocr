  <circle cx="32" cy="32" r="30" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
  
  <!-- Image/Document frame -->
  <rect x="14" y="12" width="36" height="28" rx="2" fill="none" stroke="#2563eb" stroke-width="2"/>
  
  <!-- Small image indicator (corner dot) -->
  <circle cx="18" cy="16" r="2" fill="#2563eb"/>
  
  <!-- Text lines extracted from image -->
  <line x1="14" y1="44" x2="32" y2="44" stroke="#2563eb" stroke-width="2" stroke-linecap="round"/>
  <line x1="14" y1="50" x2="38" y2="50" stroke="#2563eb" stroke-width="2" stroke-linecap="round"/>
  <line x1="14" y1="56" x2="28" y2="56" stroke="#2563eb" stroke-width="2" stroke-linecap="round"/>
  
  <!-- Optional: small lock indicator for privacy (subtle) -->
  <g opacity="0.6">
    <path d="M 42 44 L 42 42 Q 42 40 44 40 Q 46 40 46 42 L 46 44 M 42 44 L 50 44 L 50 52 Q 50 54 48 54 L 42 54 Q 40 54 40 52 L 40 44" fill="none" stroke="#2563eb" stroke-width="1.5"/>
    <circle cx="46" cy="49" r="1" fill="#2563eb"/>
